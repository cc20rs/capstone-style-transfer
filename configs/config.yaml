project:
  name: narrative-style-transfer-mvp
  version: 0.1.0

models:
  generation_model: DeepSeek-V3.2-Instruct
  judge_model: DeepSeek-V3.2
  style_embedding_model: BAAI/bge-m3
  fluency_model: uer/gpt2-chinese-cluecorpussmall
  bert_score_model: bert-base-chinese

huggingface:
  endpoint: https://hf-mirror.com

judge_models:
  - DeepSeek-V3.2

modelscope:
  enabled: true
  cache_dir: .modelscope_cache
  local_models:
    style_embedding_model: .modelscope_cache/BAAI/bge-m3
    fluency_model: .modelscope_cache/uer/gpt2-chinese-cluecorpussmall
    bert_score_model: .modelscope_cache/google-bert/bert-base-chinese

api:
  base_url: https://llmapi.paratera.com
  chat_endpoint: /chat/completions
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 1.5

generation:
  temperature: 0.7
  max_tokens: 1024

rag:
  top_k: 3

paths:
  raw_cases: data/raw/test_cases.json
  target_styles: data/raw/target_styles.json
  style_corpus: data/raw/style_corpus.json
  case_summary: data/outputs/case_summary.jsonl
  intermediate_results: data/outputs/intermediate_results.jsonl
  final_report: data/outputs/final_report.csv

evaluation:
  methods:
    semantic: BERTScore-F1
    llm_judge: merged-into-style_vector
    style_vector: llm-as-a-judge-4level
    fluency: 100_over_NLL
    linguistic: jieba_pos_stats
    allow_fallback: false
  weights:
    bert_score: 0.30
    llm_judge: 0.00
    style_vector: 0.45
    linguistic: 0.15
    fluency: 0.10
